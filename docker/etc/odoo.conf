[options]
; Minimal config for local Odoo sources running in Docker
addons_path = /workspace/odoo/addons,/mnt/extra-addons

; Database
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
admin_passwd = odoo_admin_change_me

; HTTP
xmlrpc = True
http_port = 8069
longpolling_port = 8072

; Logging
log_level = info

; Workers (tune for production as needed)
workers = 0
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_time_cpu = 60
limit_time_real = 120